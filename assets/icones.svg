<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- PREFÁCIO: fechadura sem cadeado -->
  <symbol id="icone-prefacio" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="26" width="28" height="20" rx="2"/>
    <path d="M22 26v-6a6 6 0 0 1 12 0v6"/>
    <circle cx="28" cy="36" r="2" fill="currentColor" stroke="none"/>
    <line x1="28" y1="38" x2="28" y2="42"/>
  </symbol>

  <!-- INTRODUÇÃO: olho com íris vazia -->
  <symbol id="icone-introducao" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 28 C16 14 40 14 48 28 C40 42 16 42 8 28 Z"/>
    <circle cx="28" cy="28" r="7"/>
  </symbol>

  <!-- CAP 1: bifurcação sem direção -->
  <symbol id="icone-cap01" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="28" y1="44" x2="28" y2="24"/>
    <path d="M28 24 L16 12"/>
    <path d="M28 24 L40 12"/>
  </symbol>

  <!-- CAP 2: mão com linha cortando a palma -->
  <symbol id="icone-cap02" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 44 C20 44 14 38 14 30 C14 24 18 20 22 20 L22 14 C22 12 24 11 26 12 L26 10 C26 8 28 7 30 8 L30 10 C30 8 32 7 34 8 L34 26 C36 24 38 24 40 26 C42 28 40 32 38 34 L32 44 Z"/>
    <line x1="18" y1="31" x2="34" y2="25"/>
  </symbol>

  <!-- CAP 3: círculo com ponto descentrado -->
  <symbol id="icone-cap03" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="18"/>
    <circle cx="34" cy="22" r="2.5" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- CAP 4: rosto de perfil sem traços -->
  <symbol id="icone-cap04" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 10 C38 10 44 17 44 26 C44 33 40 38 36 41 L34 46 L26 46 L24 41 C18 38 14 33 14 26 C14 17 22 10 30 10 Z"/>
  </symbol>

  <!-- CAP 5: contorno corporal feminino fechado -->
  <symbol id="icone-cap05" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 8 C32 8 35 11 35 15 C35 19 32 22 28 22 C24 22 21 19 21 15 C21 11 24 8 28 8 Z"/>
    <path d="M20 24 C16 26 14 30 15 35 L18 48 L38 48 L41 35 C42 30 40 26 36 24 C34 23 30 22 28 22 C26 22 22 23 20 24 Z"/>
  </symbol>

  <!-- CAP 6: mãos entrelaçadas, uma se desfazendo -->
  <symbol id="icone-cap06" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 34 C10 34 12 28 18 28 L28 28"/>
    <path d="M28 28 C34 28 40 24 42 20"/>
    <path d="M42 20 C43 18 44 17 45 18"/>
    <path d="M45 18 C46 19 45 22 43 24"/>
    <path d="M28 28 L28 38 C28 40 26 42 24 42 C22 42 20 40 20 38"/>
    <!-- dedos se desfazendo -->
    <path d="M36 30 C37 28 38 27 39 28" stroke-dasharray="2 3"/>
    <path d="M38 34 C40 32 41 31 42 32" stroke-dasharray="2 3"/>
    <path d="M40 38 C42 37 43 37 43 39" stroke-dasharray="2 3"/>
  </symbol>

  <!-- CAP 7: semente dentro de círculo -->
  <symbol id="icone-cap07" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="18"/>
    <path d="M28 36 C28 36 20 32 20 24 C20 18 24 15 28 15 C32 15 36 18 36 24 C36 32 28 36 28 36 Z"/>
    <line x1="28" y1="36" x2="28" y2="44"/>
  </symbol>

  <!-- CAP 8: horizonte reto com ponto acima -->
  <symbol id="icone-cap08" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="10" y1="34" x2="46" y2="34"/>
    <circle cx="28" cy="22" r="2.5" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- CAP 9: fios convergindo para nó central -->
  <symbol id="icone-cap09" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="10" y1="12" x2="28" y2="28"/>
    <line x1="28" y1="10" x2="28" y2="28"/>
    <line x1="46" y1="12" x2="28" y2="28"/>
    <line x1="10" y1="28" x2="28" y2="28"/>
    <line x1="46" y1="28" x2="28" y2="28"/>
    <line x1="10" y1="44" x2="28" y2="28"/>
    <line x1="28" y1="46" x2="28" y2="28"/>
    <line x1="46" y1="44" x2="28" y2="28"/>
    <circle cx="28" cy="28" r="3.5" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- CAP 10: círculo quase fechado -->
  <symbol id="icone-cap10" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 14 A18 18 0 1 1 38 42"/>
  </symbol>

  <!-- AGRADECIMENTOS: linha que parte do centro e expande -->
  <symbol id="icone-agradecimentos" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="28" y1="28" x2="28" y2="10"/>
    <line x1="28" y1="28" x2="44" y2="18"/>
    <line x1="28" y1="28" x2="48" y2="32"/>
    <line x1="28" y1="28" x2="38" y2="46"/>
    <line x1="28" y1="28" x2="18" y2="46"/>
    <line x1="28" y1="28" x2="8" y2="32"/>
    <line x1="28" y1="28" x2="12" y2="18"/>
    <circle cx="28" cy="28" r="2" fill="currentColor" stroke="none"/>
  </symbol>

</svg>